[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freqnir"
version = "1.0.0"
description = "Frequency Separated Near-infrared Prior Extraction for Cross-modality Image Denoising"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=1.12.1",
  "numpy>=1.23.0",
  "Pillow>=9.0.0",
  "PyYAML>=6.0",
  "tqdm>=4.64.0",
]

[tool.setuptools.packages.find]
include = ["freqnir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
